security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build|media)/)
            security: false
        # Exponio-App: Upload-Schnittstelle mit Bearer-Token (Backend → System → App-Zugänge), ohne Session und Cookies
        app_api:
            pattern: ^/api/app/
            stateless: true
            access_token:
                token_handler: App\Security\AppTokenHandler
                failure_handler: App\Security\AppApiAuthentication
            entry_point: App\Security\AppApiAuthentication
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/app/, roles: ROLE_APP_UPLOAD }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
